# Every 10 minutes: asks the API to finish (pay out or refund) every challenge that is due.
# It also keeps the free server awake, so the QuickNode Stream's deliveries do not fail.
#
# Does nothing until two repository secrets exist (Settings > Secrets and variables > Actions):
#   API_URL      the deployed API address, for example https://loser-buys-api.onrender.com
#   TICK_SECRET  the same value as TICK_SECRET on the server
name: tick

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Finish every challenge that is due
        env:
          API_URL: ${{ secrets.API_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$TICK_SECRET" ]; then
            echo "API_URL or TICK_SECRET is not set; nothing to do."
            exit 0
          fi
          # A sleeping free server can take a minute to wake, so allow retries.
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "X-Tick-Secret: $TICK_SECRET" "$API_URL/internal/tick"
