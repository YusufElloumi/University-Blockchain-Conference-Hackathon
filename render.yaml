# Render blueprint: the API and the web app (both free plan).
# Values marked "sync: false" are secrets typed into Render's dashboard, never committed.
services:
  - type: web
    name: loser-buys-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: FITNESS_PROVIDER
        value: mock
      - key: SETTLE_GRACE_SECONDS
        value: "0"
      - key: DATABASE_URL # the Neon Postgres address
        sync: false
      - key: WEB_ORIGIN # the deployed web address, e.g. https://loser-buys-web.onrender.com
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: QUICKNODE_STREAM_SECURITY_TOKEN
        sync: false
      - key: ORACLE_KEYPAIR # contents of oracle.json
        sync: false
      - key: TREASURY_KEYPAIR # contents of treasury.json
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: TICK_SECRET
        sync: false

  # The web app: a static build of web/, served by Render (free).
  - type: web
    name: loser-buys-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        value: https://loser-buys-api.onrender.com
      - key: VITE_PRIVY_APP_ID # public value, same as in .env
        sync: false
      - key: VITE_DEMO_CHALLENGE # optional: the challenge shown on the home screen
        sync: false
